version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: agent_postgres
    restart: always
    environment:
      POSTGRES_USER: admin           # 数据库用户名
      POSTGRES_PASSWORD: 123456 # 数据库密码
      POSTGRES_DB: agent_studio_db   # 默认创建的数据库名
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data # 数据持久化挂载到当前目录
      # 挂载初始化脚本，自动启用 vector 扩展
      - ./Agent-Studio/src/main/resources/db/init-vector-extension.sql:/docker-entrypoint-initdb.d/init-vector-extension.sql
    networks:
      - agent-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  agent-net:
    driver: bridge