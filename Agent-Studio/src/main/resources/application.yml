
spring:
  config:
    name: demo
  profiles:
    active: dev
  # 强制使用 UTF-8 编码
  web:
    resources:
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  # 强制请求和响应使用 UTF-8 编码
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

# Agent 执行配置
agent:
  execution:
    timeout: 300s              # 执行超时时间
    heartbeat-interval: 30s    # 心跳间隔
    max-title-length: 15        # 标题最大长度
    default-max-iterations: 100  # 默认最大迭代次数
    debug-mode: false           # 调试模式
    retry:
      enabled: true             # 是否启用重试
      max-retries: 3            # 最大重试次数
      initial-backoff: 1s       # 初始退避时间
      backoff-multiplier: 2.0   # 退避时间倍数
      max-backoff: 30s          # 最大退避时间

# MCP 管理器配置
mcp:
  manager:
    health-check-interval: 1m    # 健康检查间隔
    default-timeout: 30s         # 默认连接超时时间
    auto-connect-on-startup: true # 启动时自动连接
    max-retries: 3               # 最大重试次数
    retry-interval: 5s           # 重试间隔
    enable-health-check: true    # 是否启用健康检查
    health-check-timeout: 10s    # 健康检查超时时间
  servers:
    servers: []  # MCP 服务器列表，在 application-dev.yml 中配置

# Node.js/NPX 路径配置
nodejs:
  npx-path: ${NPX_PATH:}  # NPX 命令路径，默认使用系统 PATH 中的 npx

# 临时文件上传配置
temporary:
  file:
    max-size: 10485760          # 最大文件大小（字节），默认 10MB
    allowed-types: pdf,txt,md,markdown  # 支持的文件类型
    chunk-strategy: paragraph    # 分块策略：paragraph（按段落）

# API 密钥配置
api:
  keys:
    keys: {}  # API 密钥映射，在 application-dev.yml 中配置

# 可观测性配置
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info,metrics
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name:Agent-Studio}
      environment: ${spring.profiles.active:default}
  observation:
    enabled: true
  tracing:
    sampling:
      probability: 1.0  # 100% 采样（开发环境）

# 可观测性日志
logging:
  charset:
    console: UTF-8
    file: UTF-8
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSS+08:00}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
  level:
    io.micrometer.observation: DEBUG
    cn.ts.graph.observation: DEBUG