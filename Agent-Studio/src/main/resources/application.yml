
spring:
  config:
    name: demo
  profiles:
    active: dev
  # 强制使用 UTF-8 编码
  web:
    resources:
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  # 强制请求和响应使用 UTF-8 编码
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

# Agent 执行配置
agent:
  execution:
    timeout: 300s              # 执行超时时间
    heartbeat-interval: 30s    # 心跳间隔
    max-title-length: 15        # 标题最大长度
    default-max-iterations: 10  # 默认最大迭代次数
    debug-mode: false           # 调试模式