
spring:
  config:
    name: demo
  profiles:
    active: dev
  # 寮哄埗浣跨敤 UTF-8 缂栫爜
  web:
    resources:
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  # 寮哄埗璇锋眰鍜屽搷搴斾娇鐢?UTF-8 缂栫爜
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

# Agent 鎵ц閰嶇疆
agent:
  subagent:
    progress-buffer-size: 1024
  execution:
    timeout: 300s              # 鎵ц瓒呮椂鏃堕棿
    heartbeat-interval: 30s    # 蹇冭烦闂撮殧
    max-title-length: 15        # 鏍囬鏈€澶ч暱搴?
    default-max-iterations: 100  # 榛樿鏈€澶ц凯浠ｆ鏁?
    debug-mode: false           # 璋冭瘯妯″紡
    retry:
      enabled: true             # 鏄惁鍚敤閲嶈瘯
      max-retries: 3            # 鏈€澶ч噸璇曟鏁?
      initial-backoff: 1s       # 鍒濆閫€閬挎椂闂?
      backoff-multiplier: 2.0   # 閫€閬挎椂闂村€嶆暟
      max-backoff: 30s          # 鏈€澶ч€€閬挎椂闂?
    context-prompt:
      enabled: true
      include-time: true
      include-capabilities: true
  shelltool:
    enabled: false
    default-timeout-seconds: 30
    max-timeout-seconds: 120
    max-output-lines: 400
    max-output-bytes: 131072
    idle-ttl-seconds: 900
    cleanup-interval: 60s
    auto-restart-on-timeout: true
    allowed-working-directories:
      - ${SHELLTOOL_ALLOWED_ROOT:${user.dir}}
    blocked-command-patterns:
      - "(?i)\\brm\\s+-rf\\s+/"
      - "(?i)\\bshutdown\\b"
      - "(?i)\\breboot\\b"
      - "(?i)\\bformat-volume\\b"
      - "(?i)\\bdiskpart\\b"
      - "(?i)\\breg\\s+delete\\b"
  filetool:
    enabled: true
    max-read-bytes: 2097152
    max-read-lines: 2000
    max-search-results: 5000
    read-allowed-roots:
      - D:/JavaProject/Hello-Agent
    write-allowed-roots:
      - D:/JavaProject/Hello-Agent/docs
      - D:/JavaProject/Hello-Agent/uploads
  audit:
    enabled: true
    include-response: true
    max-body-size: 32768
  deep-search:
    enabled: true
    agent-name: deep-search
    display-name: Deep Search
    description: Built-in deep search agent for multi-step research and synthesis.
    include-general-purpose-subagent: true
    max-iterations: 25
    stream-enabled: true
    max-parallel-subagents: 3
    research-tool-allowlist: []
    critique-tool-allowlist: []
    general-tool-allowlist: []
    blocked-tool-names: []
# MCP 绠＄悊鍣ㄩ厤缃?
mcp:
  manager:
    health-check-interval: 1m    # 鍋ュ悍妫€鏌ラ棿闅?
    default-timeout: 30s         # 榛樿杩炴帴瓒呮椂鏃堕棿
    auto-connect-on-startup: true # 鍚姩鏃惰嚜鍔ㄨ繛鎺?
    max-retries: 3               # 鏈€澶ч噸璇曟鏁?
    retry-interval: 5s           # 閲嶈瘯闂撮殧
    enable-health-check: true    # 鏄惁鍚敤鍋ュ悍妫€鏌?
    health-check-timeout: 10s    # 鍋ュ悍妫€鏌ヨ秴鏃舵椂闂?
  servers:
    servers: []  # MCP 鏈嶅姟鍣ㄥ垪琛紝鍦?application-dev.yml 涓厤缃?

# Node.js/NPX 璺緞閰嶇疆
nodejs:
  npx-path: ${NPX_PATH:}  # NPX 鍛戒护璺緞锛岄粯璁や娇鐢ㄧ郴缁?PATH 涓殑 npx

# 涓存椂鏂囦欢涓婁紶閰嶇疆
temporary:
  file:
    max-size: 10485760          # 鏈€澶ф枃浠跺ぇ灏忥紙瀛楄妭锛夛紝榛樿 10MB
    allowed-types: pdf,txt,md,markdown  # 鏀寔鐨勬枃浠剁被鍨?
    chunk-strategy: paragraph    # 鍒嗗潡绛栫暐锛歱aragraph锛堟寜娈佃惤锛?

# API 瀵嗛挜閰嶇疆
api:
  keys:
    keys: {}  # API 瀵嗛挜鏄犲皠锛屽湪 application-dev.yml 涓厤缃?

# LLM 手动配置（用于手动创建 OpenAI 兼容 ChatModel Bean）

# 鍙娴嬫€ч厤缃?
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info,metrics
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name:Agent-Studio}
      environment: ${spring.profiles.active:default}
  observation:
    enabled: true
  tracing:
    sampling:
      probability: 1.0  # 100% 閲囨牱锛堝紑鍙戠幆澧冿級

# 鍙娴嬫€ф棩蹇?
logging:
  charset:
    console: UTF-8
    file: UTF-8
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSS+08:00}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
  level:
    io.micrometer.observation: DEBUG
    cn.ts.graph.observation: DEBUG
